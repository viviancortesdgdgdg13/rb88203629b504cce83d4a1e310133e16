<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private application</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050807; color: #f7f9f8; }
    main { width: min(420px, calc(100vw - 32px)); border: 1px solid #53615a; padding: 28px; background: #0b100e; }
    h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: 0; }
    p { margin: 0 0 22px; color: #b9c3be; line-height: 1.45; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #6b7871; background: #020403; color: #fff; font: inherit; }
    button { width: 100%; height: 44px; margin-top: 12px; border: 1px solid #75c794; background: #176b35; color: #fff; font: 700 16px Arial, sans-serif; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 22px; margin: 12px 0 0; color: #ff9d9d; }
  </style>
</head>
<body>
  <main>
    <h1>Private application</h1>
    <p>This deployment is encrypted. Enter its local access key to continue.</p>
    <form id="unlockForm">
      <label for="accessKey">Access key</label>
      <input id="accessKey" type="password" autocomplete="current-password" required autofocus>
      <button id="unlockButton" type="submit">Unlock</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const decoder = new TextDecoder();
    const fromBase64 = (value) => Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
    const form = document.getElementById("unlockForm");
    const input = document.getElementById("accessKey");
    const button = document.getElementById("unlockButton");
    const status = document.getElementById("status");

    async function decryptFile(key, encrypted) {
      const combined = new Uint8Array(fromBase64(encrypted.data).length + 16);
      combined.set(fromBase64(encrypted.data));
      combined.set(fromBase64(encrypted.tag), combined.length - 16);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(encrypted.iv), tagLength: 128 },
        key,
        combined,
      );
      return decoder.decode(plaintext);
    }

    async function unlock(password) {
      const payload = await fetch("payload.json", { cache: "no-store", referrerPolicy: "no-referrer" }).then((response) => {
        if (!response.ok) throw new Error("Encrypted payload unavailable.");
        return response.json();
      });
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: fromBase64(payload.salt), iterations: payload.iterations },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const names = ["index.html", "main.css", "variables.js", "fx.bundle.js", "game.js"];
      const values = await Promise.all(names.map((name) => decryptFile(key, payload.files[name])));
      return Object.fromEntries(names.map((name, index) => [name, values[index]]));
    }

    function runScript(source, name) {
      const script = document.createElement("script");
      script.textContent = source + "\n//# sourceURL=" + name;
      document.body.appendChild(script);
    }

    function launch(files) {
      const parsed = new DOMParser().parseFromString(files["index.html"], "text/html");
      parsed.querySelectorAll("script, link[rel='stylesheet'], link[rel='manifest']").forEach((node) => node.remove());
      document.documentElement.lang = parsed.documentElement.lang || "en";
      document.head.innerHTML = parsed.head.innerHTML;
      document.body.innerHTML = parsed.body.innerHTML;
      const style = document.createElement("style");
      style.textContent = files["main.css"];
      document.head.appendChild(style);
      runScript(files["variables.js"], "variables.js");
      runScript(files["fx.bundle.js"], "fx.bundle.js");
      runScript(files["game.js"], "game.js");
      if (typeof window.aiCommand746 === "function") window.aiCommand746(0);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = "Decrypting...";
      try {
        const files = await unlock(input.value);
        input.value = "";
        launch(files);
      } catch (error) {
        status.textContent = "Invalid access key.";
        button.disabled = false;
        input.select();
      }
    });
  </script>
</body>
</html>
